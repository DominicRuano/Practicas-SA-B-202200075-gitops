{{- if .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "sa-platform.secretName" . | quote }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "sa-platform.labels" . | nindent 4 }}
spec:
  refreshPolicy: Periodic
  refreshInterval: {{ .Values.externalSecret.refreshInterval | quote }}
  secretStoreRef:
    kind: {{ .Values.externalSecret.secretStoreRef.kind | quote }}
    name: {{ .Values.externalSecret.secretStoreRef.name | quote }}
  target:
    name: {{ include "sa-platform.secretName" . | quote }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      data:
        postgres-password: {{ `{{ .postgresAdminPassword }}` | quote }}
        password: {{ `{{ .postgresApplicationPassword }}` | quote }}
        replication-password: {{ `{{ .postgresApplicationPassword }}` | quote }}
        rabbitmq-password: {{ `{{ .rabbitmqPassword }}` | quote }}
        rabbitmq-erlang-cookie: {{ `{{ .rabbitmqErlangCookie }}` | quote }}
        JWT_SECRET_BASE64: {{ `{{ .jwtSecretBase64 }}` | quote }}
        DATA_ENCRYPTION_KEY_BASE64: {{ `{{ .dataEncryptionKeyBase64 }}` | quote }}
        EMAIL_INDEX_KEY_BASE64: {{ `{{ .emailIndexKeyBase64 }}` | quote }}
        AUTH_DATABASE_URL: {{ `postgresql://platform:{{ .postgresApplicationPassword }}@postgresql:5432/autenticacion` | quote }}
        SOLICITUDES_DATABASE_URL: {{ `postgresql://platform:{{ .postgresApplicationPassword }}@postgresql:5432/solicitudes` | quote }}
        CATALOGO_DATABASE_URL: {{ `postgresql://platform:{{ .postgresApplicationPassword }}@postgresql:5432/catalogo` | quote }}
        REPORTES_DATABASE_URL: {{ `postgresql://platform:{{ .postgresApplicationPassword }}@postgresql:5432/reportes` | quote }}
        OPERACIONES_DATABASE_URL: {{ `postgresql://platform:{{ .postgresApplicationPassword }}@postgresql:5432/operaciones` | quote }}
        RABBITMQ_URL: {{ `amqp://platform:{{ .rabbitmqPassword }}@rabbitmq:5672/%2F` | quote }}
  data:
    - secretKey: postgresAdminPassword
      remoteRef:
        key: {{ .Values.externalSecret.remoteKeys.postgresAdminPassword | quote }}
    - secretKey: postgresApplicationPassword
      remoteRef:
        key: {{ .Values.externalSecret.remoteKeys.postgresApplicationPassword | quote }}
    - secretKey: rabbitmqPassword
      remoteRef:
        key: {{ .Values.externalSecret.remoteKeys.rabbitmqPassword | quote }}
    - secretKey: rabbitmqErlangCookie
      remoteRef:
        key: {{ .Values.externalSecret.remoteKeys.rabbitmqErlangCookie | quote }}
    - secretKey: jwtSecretBase64
      remoteRef:
        key: {{ .Values.externalSecret.remoteKeys.jwtSecretBase64 | quote }}
    - secretKey: dataEncryptionKeyBase64
      remoteRef:
        key: {{ .Values.externalSecret.remoteKeys.dataEncryptionKeyBase64 | quote }}
    - secretKey: emailIndexKeyBase64
      remoteRef:
        key: {{ .Values.externalSecret.remoteKeys.emailIndexKeyBase64 | quote }}
{{- end }}
