apiVersion: v2
name: sa-platform
description: Plataforma GitOps con entrega progresiva de la Practica 8
type: application
icon: https://kubernetes.io/images/favicon.png
version: 0.3.0
appVersion: "1.0.0"
kubeVersion: ">=1.27.0-0"
keywords:
  - kubernetes
  - microservices
  - practica-8
  - gitops
  - argo-rollouts
maintainers:
  - name: 202200075
dependencies:
  - name: autenticacion
    version: 0.3.0
    repository: file://../autenticacion
    condition: autenticacion.enabled
  - name: solicitudes
    version: 0.3.0
    repository: file://../solicitudes
    condition: solicitudes.enabled
  - name: catalogo
    version: 0.3.0
    repository: file://../catalogo
    condition: catalogo.enabled
  - name: reportes
    version: 0.3.0
    repository: file://../reportes
    condition: reportes.enabled
  - name: gateway
    version: 0.3.0
    repository: file://../gateway
    condition: gateway.enabled
  - name: postgresql
    version: 16.7.27
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: postgresql.enabled
  - name: rabbitmq
    version: 16.0.14
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: rabbitmq.enabled
