repository: https://github.com/DominicRuano/Practicas-SA-B-202200075-gitops
revision: main
applications:
- name: p9-argo-rollouts
  wave: -40
  namespace: argo-rollouts
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-rollouts
    targetRevision: 2.43.1
    helm:
      valuesObject: {}
- name: p9-kyverno
  wave: -40
  namespace: kyverno
  source:
    repoURL: https://kyverno.github.io/kyverno
    chart: kyverno
    targetRevision: 3.8.2
    helm:
      valuesObject:
        kyverno-api:
          annotations:
            practica: p9
          labels:
            practica: p9
        test:
          image:
            tag: v1.18.2
        webhooksCleanup:
          image:
            tag: v1.18.2
- name: p9-external-secrets
  wave: -40
  namespace: external-secrets
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 2.10.0
    helm:
      valuesObject:
        installCRDs: true
- name: p9-velero
  wave: -40
  namespace: velero
  source:
    repoURL: https://vmware-tanzu.github.io/helm-charts
    chart: velero
    targetRevision: 12.2.1
    helm:
      valuesObject:
        image:
          repository: velero/velero
          tag: v1.18.2
        initContainers:
        - name: velero-plugin-for-gcp
          image: velero/velero-plugin-for-gcp:v1.14.4
          volumeMounts:
          - mountPath: /target
            name: plugins
        credentials:
          useSecret: false
        serviceAccount:
          server:
            create: true
            name: velero
            annotations:
              iam.gke.io/gcp-service-account: sa-p9-velero@elated-pathway-341621.iam.gserviceaccount.com
        configuration:
          backupStorageLocation:
          - name: default
            provider: gcp
            bucket: elated-pathway-341621-sa-p9-backups
            default: true
            config:
              serviceAccount: sa-p9-velero@elated-pathway-341621.iam.gserviceaccount.com
          volumeSnapshotLocation: []
          defaultVolumesToFsBackup: true
          features: ''
          backupSyncPeriod: 30s
        snapshotsEnabled: false
        deployNodeAgent: true
        nodeAgent:
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        upgradeCRDs: true
- name: p9-config
  wave: -20
  namespace: sa-p9
  path: p9/config
- name: p9-platform
  wave: 0
  namespace: sa-p9
  path: p9/platform
  ignoreDifferences:
  - group: ''
    kind: Service
    jsonPointers:
    - /spec/selector/rollouts-pod-template-hash
  valueFiles:
  - values.yaml
  - ../../p10/platform-values.yaml
- name: p9-protection
  wave: 10
  namespace: sa-p9
  path: p9/protection
- name: p10-monitoring
  wave: -15
  namespace: observabilidad
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 92.10.1
    helm:
      valuesObject:
        fullnameOverride: p10-monitoring
        defaultRules:
          create: false
        kubeApiServer:
          enabled: false
        kubeControllerManager:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeEtcd:
          enabled: false
        kubeProxy:
          enabled: false
        kubelet:
          enabled: false
        coreDns:
          enabled: false
        kubeDns:
          enabled: false
        nodeExporter:
          enabled: false
        kubeStateMetrics:
          enabled: false
        prometheusOperator:
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          admissionWebhooks:
            enabled: false
          tls:
            enabled: false
          prometheusConfigReloader:
            resources:
              requests:
                cpu: 10m
                memory: 24Mi
              limits:
                cpu: 100m
                memory: 64Mi
        prometheus:
          prometheusSpec:
            scrapeInterval: 10s
            evaluationInterval: 10s
            retention: 24h
            retentionSize: 6GB
            enableAdminAPI: false
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
            resources:
              requests:
                cpu: 150m
                memory: 512Mi
              limits:
                cpu: 1000m
                memory: 1536Mi
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: standard-rwo
                  accessModes:
                  - ReadWriteOnce
                  resources:
                    requests:
                      storage: 10Gi
        alertmanager:
          config:
            global:
              resolve_timeout: 1m
            route:
              receiver: operacion
              group_by:
              - alertname
              group_wait: 5s
              group_interval: 30s
              repeat_interval: 1h
              routes:
              - receiver: operacion
                matchers:
                - practice="p10"
            receivers:
            - name: operacion
          alertmanagerSpec:
            resources:
              requests:
                cpu: 20m
                memory: 64Mi
              limits:
                cpu: 200m
                memory: 128Mi
        grafana:
          admin:
            existingSecret: p10-grafana-admin
            userKey: admin-user
            passwordKey: admin-password
          defaultDashboardsEnabled: false
          testFramework:
            enabled: false
          persistence:
            enabled: true
            storageClassName: standard-rwo
            size: 10Gi
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
          sidecar:
            dashboards:
              enabled: true
              searchNamespace: observabilidad
            datasources:
              enabled: false
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                cpu: 100m
                memory: 128Mi
          datasources:
            datasources.yaml:
              apiVersion: 1
              datasources:
              - name: Prometheus
                uid: prometheus
                type: prometheus
                access: proxy
                url: http://p10-monitoring-prometheus:9090
                isDefault: true
              - name: Loki
                uid: loki
                type: loki
                access: proxy
                url: http://p10-loki:3100
                jsonData:
                  derivedFields:
                  - name: TraceID
                    matcherRegex: '"trace_id"\s*:\s*"([a-f0-9]+)"'
                    datasourceUid: tempo
                    url: ${__value.raw}
              - name: Tempo
                uid: tempo
                type: tempo
                access: proxy
                url: http://p10-tempo:3200
                jsonData:
                  tracesToLogsV2:
                    datasourceUid: loki
                    spanStartTimeShift: -1m
                    spanEndTimeShift: 1m
                    filterByTraceID: false
                    customQuery: true
                    query: '{service_name=~"gateway|solicitudes|catalogo"} | json
                      | trace_id="${__span.traceId}"'
                  serviceMap:
                    datasourceUid: prometheus
                  nodeGraph:
                    enabled: true
          deploymentStrategy:
            type: RollingUpdate
            rollingUpdate:
              maxSurge: 0
              maxUnavailable: 1
  serverSideDiff: true
- name: p10-observability
  wave: -10
  namespace: observabilidad
  path: p10/observability
  serverSideDiff: true
