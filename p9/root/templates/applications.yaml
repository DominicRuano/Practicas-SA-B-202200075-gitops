{{- range .Values.applications }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .name }}
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: {{ .wave | quote }}
spec:
  project: default
  {{- with .ignoreDifferences }}
  ignoreDifferences:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  source:
    {{- if .source }}
    {{- toYaml .source | nindent 4 }}
    {{- else }}
    repoURL: {{ $.Values.repository | quote }}
    targetRevision: {{ $.Values.revision | quote }}
    path: {{ .path | quote }}
    {{- with .valueFiles }}
    helm:
      valueFiles:
        {{- toYaml . | nindent 8 }}
    {{- end }}
    {{- end }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .namespace }}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      {{- if .ignoreDifferences }}
      - RespectIgnoreDifferences=true
      {{- end }}
    retry:
      limit: 10
      backoff: {duration: 10s, factor: 2, maxDuration: 2m}
{{- end }}
