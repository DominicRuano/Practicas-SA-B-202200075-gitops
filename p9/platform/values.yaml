global:
  imageRegistry: ''
  applicationImageRegistry: ghcr.io/dominicruano/sa-p8
  applicationImageTag: 1.1.0
  imagePullSecrets: []
  defaultStorageClass: standard-rwo
  storageClass: standard-rwo
  security:
    allowInsecureImages: true
  secret:
    name: sa-platform-secrets
    revision: '1'
externalSecret:
  enabled: false
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: p9-gcp-secret-manager
  remoteKeys:
    postgresAdminPassword: sa-p9-postgres-admin-password
    postgresApplicationPassword: sa-p9-postgres-application-password
    rabbitmqPassword: sa-p9-rabbitmq-password
    rabbitmqErlangCookie: sa-p9-rabbitmq-erlang-cookie
    jwtSecretBase64: sa-p9-jwt-secret-base64
    dataEncryptionKeyBase64: sa-p9-data-encryption-key-base64
    emailIndexKeyBase64: sa-p9-email-index-key-base64
secretStore:
  enabled: false
  name: p9-gcp-secret-manager
  projectID: elated-pathway-341621
  serviceAccountRef:
    name: sa-p9-secrets
    namespace: sa-p9
policies:
  enabled: true
  failureAction: Enforce
networkPolicies:
  enabled: true
  publicGateway: false
  ingressNamespace: ingress-nginx
  ingressPodLabels:
    app.kubernetes.io/name: ingress-nginx
  dnsNamespace: kube-system
  dnsPodLabels:
    k8s-app: kube-dns
cronJobs:
  enabled: true
  suspend: false
  image:
    registry: ghcr.io/dominicruano/sa-p8
    repository: jobs
    tag: 1.1.0
    pullPolicy: IfNotPresent
  timeZone: America/Guatemala
  commonConfig:
    CARNE: '202200075'
    TZ: America/Guatemala
    LOG_LEVEL: info
    RABBITMQ_EXCHANGE: sa.events
  jobs:
    registrar-ejecucion:
      schedule: '*/2 * * * *'
      command:
      - python
      - -m
      - jobs.registrar_ejecucion
      secretKeys:
        DATABASE_URL: OPERACIONES_DATABASE_URL
    publicar-resumen:
      schedule: '*/10 * * * *'
      command:
      - python
      - -m
      - jobs.publicar_resumen
      secretKeys:
        DATABASE_URL: OPERACIONES_DATABASE_URL
        RABBITMQ_URL: RABBITMQ_URL
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 60
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 2
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  resources:
    requests:
      cpu: 25m
      memory: 48Mi
    limits:
      cpu: 200m
      memory: 128Mi
autenticacion:
  enabled: true
  fullnameOverride: autenticacion
  replicaCount: 2
  minReadySeconds: 5
  terminationGracePeriodSeconds: 30
  lifecycle:
