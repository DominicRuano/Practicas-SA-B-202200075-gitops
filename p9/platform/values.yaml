      sleepSeconds: 5
  image:
    registry: ghcr.io/dominicruano/sa-p8
    repository: autenticacion
    tag: 1.1.0
    pullPolicy: IfNotPresent
  config:
    NODE_ENV: production
    API_PORT: '3000'
    WEB_ORIGIN: http://127.0.0.1:8080
    DB_SSL: 'false'
    JWT_ACCESS_TTL_SECONDS: '3600'
    JWT_RENEWAL_GRACE_SECONDS: '86400'
    JWT_ISSUER: practica-8-autenticacion
    JWT_AUDIENCE: practica-8-gateway
    COOKIE_SECURE: 'false'
    PROMOTION_STATUS: ready
    LOG_LEVEL: warn
  secretEnv:
    DATABASE_URL: AUTH_DATABASE_URL
    JWT_SECRET_BASE64: JWT_SECRET_BASE64
    DATA_ENCRYPTION_KEY_BASE64: DATA_ENCRYPTION_KEY_BASE64
    EMAIL_INDEX_KEY_BASE64: EMAIL_INDEX_KEY_BASE64
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 384Mi
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 2
  pdb:
    enabled: true
    minAvailable: 1
