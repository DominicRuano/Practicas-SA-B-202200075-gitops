    hosts:
    - host: ''
      paths:
      - path: /
        pathType: Prefix
    tls: []
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 300m
      memory: 192Mi
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 2
  pdb:
    enabled: true
    minAvailable: 1
rabbitmq:
  enabled: true
  fullnameOverride: rabbitmq
  replicaCount: 3
  automountServiceAccountToken: true
  rbac:
    create: true
  pdb:
    create: true
    minAvailable: 2
    maxUnavailable: ''
  plugins: rabbitmq_management rabbitmq_peer_discovery_k8s
  extraPlugins: ''
  clustering:
    enabled: true
  image:
    registry: docker.io
    repository: bitnamilegacy/rabbitmq
    tag: 4.1.3-debian-12-r1
  auth:
    username: platform
    existingPasswordSecret: sa-platform-secrets
    existingSecretPasswordKey: rabbitmq-password
    existingErlangSecret: sa-platform-secrets
    existingSecretErlangKey: rabbitmq-erlang-cookie
  persistence:
    enabled: true
    size: 2Gi
  resources:
    requests:
      cpu: 150m
      memory: 256Mi
    limits:
      cpu: 750m
      memory: 768Mi
  networkPolicy:
    enabled: false
  metrics:
    enabled: false
  podAntiAffinityPreset: hard
  extraConfiguration: |
    default_queue_type = quorum
    quorum_queue.continuous_membership_reconciliation.enabled = true
    quorum_queue.continuous_membership_reconciliation.target_group_size = 3
    quorum_queue.continuous_membership_reconciliation.interval = 30000
  podAnnotations:
    backup.velero.io/backup-volumes-excludes: data
  podManagementPolicy: Parallel
postgresql-ha:
  enabled: true
  fullnameOverride: postgresql-ha
  postgresql:
    image:
      registry: docker.io
      repository: bitnamilegacy/postgresql-repmgr
      tag: 17.6.0-debian-12-r2
    replicaCount: 3
    username: platform
    database: autenticacion
    existingSecret: sa-platform-secrets
    podAntiAffinityPreset: hard
    pdb:
      create: true
      minAvailable: 2
      maxUnavailable: ''
    resources:
      requests:
        cpu: 150m
        memory: 256Mi
      limits:
        cpu: 750m
        memory: 768Mi
    initdbScripts:
      00-create-databases.sh: |
        #!/bin/bash
        set -euo pipefail

        readonly admin_password_file="/opt/bitnami/postgresql/secrets/postgres-password"
        if [[ ! -r "${admin_password_file}" ]]; then
          echo "No se puede leer el password administrativo de PostgreSQL." >&2
          exit 1
        fi

        export PGPASSWORD
        PGPASSWORD="$(< "${admin_password_file}")"
        readonly -a psql_args=(
          --host 127.0.0.1
          --port "${POSTGRESQL_PORT_NUMBER:-5432}"
          --username postgres
          --dbname postgres
          --no-password
          --set=ON_ERROR_STOP=1
        )

        for database in solicitudes catalogo reportes operaciones; do
          exists="$(psql "${psql_args[@]}" --tuples-only --no-align \
            --command "SELECT 1 FROM pg_database WHERE datname = '${database}'")"
          if [[ "${exists}" == "1" ]]; then
            echo "La base ${database} ya existe; se conserva."
          else
            psql "${psql_args[@]}" \
              --command "CREATE DATABASE \"${database}\" OWNER platform"
            echo "Base ${database} creada."
          fi
        done

        unset PGPASSWORD
    networkPolicy:
      enabled: false
    podAnnotations:
      backup.velero.io/backup-volumes-excludes: data
  pgpool:
    image:
      registry: docker.io
      repository: bitnamilegacy/pgpool
      tag: 4.6.3-debian-12-r0
    replicaCount: 2
    existingSecret: sa-platform-secrets
    podAntiAffinityPreset: hard
    pdb:
      create: true
      minAvailable: 1
      maxUnavailable: ''
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 384Mi
    networkPolicy:
      enabled: false
    useLoadBalancing: false
    customUsersSecret: sa-platform-secrets
  persistence:
    enabled: true
    size: 2Gi
  volumePermissions:
    enabled: false
