{{- if .Values.policies.enabled }}
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: sa-p9-disallow-latest
  labels:
    {{- include "sa-platform.labels" . | nindent 4 }}
spec:
  background: true
  rules:
    - name: require-versioned-images
      skipBackgroundRequests: true
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [{{ .Release.Namespace | quote }}]
      validate:
        allowExistingViolations: true
        failureAction: {{ .Values.policies.failureAction }}
        message: Las imagenes deben utilizar una etiqueta versionada.
        pattern:
          spec:
            containers:
              - image: >-
                  !*:latest
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: sa-p9-require-resources
  labels:
    {{- include "sa-platform.labels" . | nindent 4 }}
spec:
  background: true
  rules:
    - name: require-requests-and-limits
      skipBackgroundRequests: true
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [{{ .Release.Namespace | quote }}]
      validate:
        allowExistingViolations: true
        failureAction: {{ .Values.policies.failureAction }}
        message: Cada contenedor debe declarar solicitudes y limites de CPU y memoria.
        pattern:
          spec:
            containers:
              - resources:
                  requests:
                    cpu: "?*"
                    memory: "?*"
                  limits:
                    cpu: "?*"
                    memory: "?*"
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: sa-p9-require-non-root
  labels:
    {{- include "sa-platform.labels" . | nindent 4 }}
spec:
  background: true
  rules:
    - name: require-non-root
      skipBackgroundRequests: true
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [{{ .Release.Namespace | quote }}]
      validate:
        allowExistingViolations: true
        failureAction: {{ .Values.policies.failureAction }}
        message: Los pods deben ejecutarse como usuarios sin privilegios.
        anyPattern:
          - spec:
              securityContext:
                runAsNonRoot: true
              containers:
                - securityContext:
                    "=(runAsNonRoot)": true
                    allowPrivilegeEscalation: false
          - spec:
              containers:
                - securityContext:
                    runAsNonRoot: true
                    allowPrivilegeEscalation: false
{{- end }}
